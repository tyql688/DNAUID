[tool.isort]
profile = "black"
line_length = 79
length_sort = true
skip_gitignore = true
force_sort_within_sections = true
extra_standard_library = ["typing_extensions"]

[tool.poetry]
name = "DNAUID"
version = "1.0.0"
description = "支持OneBot(QQ)、OneBotV12、QQ频道、微信、KOOK（开黑啦）、Telegram（电报）、FeiShu（飞书）、DoDo、Villa（米游社大别野）、Discord的全功能HoshinoBot/NoneBot2/Koishi/yunzai/ZeroBot二重螺旋机器人插件"
authors = ["tyql688 <632558678@qq.com>"]
license = "GPL-3.0-or-later"
readme = "README.md"
homepage = "https://github.com/tyql688/DNAUID"
repository = "https://github.com/tyql688/DNAUID"

[tool.poetry.dependencies]
python = ">=3.11, <4.0"


[tool.pdm.build]
includes = []
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
authors = [{ name = "tyql688", email = "632558678@qq.com" }]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11, <4.0"
dependencies = [
    "pycryptodome>=3.23.0",
    "dna-builder-sdk>=0.1.2",
    "websocket-client>=1.9.0",
]
# gsuid_core 启动时对这里的包做版本比对并升级；下限由 Renovate 与 dependencies 同步抬高
gscore_auto_update_dep = ["dna-builder-sdk>=0.1.2"]
name = "DNAUID"
version = "1.0.0"
description = "支持OneBot(QQ)、OneBotV12、QQ频道、微信、KOOK（开黑啦）、Telegram（电报）、FeiShu（飞书）、DoDo、Villa（米游社大别野）、Discord的全功能HoshinoBot/NoneBot2/Koishi/yunzai/ZeroBot二重螺旋机器人插件"
readme = "README.md"

[project.urls]
homepage = "https://github.com/tyql688/DNAUID"
repository = "https://github.com/tyql688/DNAUID"

[dependency-groups]
# e2e 套件依赖：uv sync --group e2e / uv run --group e2e e2e/run_web.py
# mock 宿主、Web 服务与不装宿主时导入插件所需的依赖
e2e = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pillow>=10",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2",
    "aiosqlite>=0.19",
    "httpx>=0.27",
    "jinja2>=3.1",
    "cachetools>=5",
    "pydantic>=2",
    "aiohttp>=3.9",
    "async-timeout>=4",
    "starlette>=0.37",
    "greenlet>=3",
    "tzdata>=2024.1",
    "msgspec>=0.13",
    "watchfiles>=1.0",
    "aiofiles>=0.8",
    "qrcode>=7.3",
    "fastapi>=0.115",
    "uvicorn>=0.20",
]
